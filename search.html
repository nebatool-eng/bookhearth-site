<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Bookhearth</title>
<meta name="description" content="Search stories, reviews, and reading lists on Bookhearth.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-head wrap">
    <p class="eyebrow" id="page-eyebrow">Search</p>
    <h1 id="page-title-text">What are you looking for?</h1>
  </section>

  <section class="wrap" style="padding-top:0;">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search stories, reviews, journal entries, reading lists...">
    </div>
    <div class="filter-row">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="Review">Reviews</button>
      <button class="filter-chip" data-filter="Story">Stories</button>
      <button class="filter-chip" data-filter="Journal">Journal</button>
      <button class="filter-chip" data-filter="Reading List">Reading Lists</button>
    </div>
    <div class="row-list" id="search-results"></div>
    <div class="search-empty" id="search-empty">
      <h3>Nothing on the shelf matches that.</h3>
      <p>Try a different word, or browse everything from the menu above.</p>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="loader.js"></script>
<script src="script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const settings = await getSettings();
  if (settings) {
    document.getElementById("page-eyebrow").textContent = settings.searchPageEyebrow || "Search";
    document.getElementById("page-title-text").textContent = settings.searchPageTitle || "";
  }
});
</script>
</body>
</html>
