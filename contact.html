<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Bookhearth</title>
<meta name="description" content="Get in touch with Bookhearth.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-head wrap">
    <p class="eyebrow" id="page-eyebrow">Contact</p>
    <h1 id="page-title-text">Say hello.</h1>
  </section>

  <section class="wrap">
    <div class="contact-grid">
      <div class="prose" id="contact-intro"></div>

      <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contact">
        <p style="display:none;">
          <label>Leave this field blank: <input name="bot-field"></label>
        </p>
        <div class="field-row">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" required>
        </div>
        <div class="field-row">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="field-row">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="What's on your mind?" required></textarea>
        </div>
        <button type="submit" class="btn">Send message</button>
        <p id="contact-note" style="display:none; margin-top: 14px; font-size: 0.9rem;"></p>
      </form>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="loader.js"></script>
<script src="script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const settings = await getSettings();
  if (settings) {
    document.getElementById("page-eyebrow").textContent = settings.contactPageEyebrow || "Contact";
    document.getElementById("page-title-text").textContent = settings.contactPageTitle || "";
    document.getElementById("contact-intro").innerHTML = paragraphsToHTML(settings.contactPageIntro);
  }
});
</script>
</body>
</html>
